# Full stack: PostgreSQL + Spring Boot API + React (nginx).  Usage:  cp .env.example .env  (edit)  &&  docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-store_inventory}
      POSTGRES_USER: ${DB_USERNAME:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-store_inventory}
      DB_USERNAME: ${DB_USERNAME:-store}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_ISSUER: ${JWT_ISSUER:-store-inventory}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P7D}
      # Plain-HTTP local use needs false. Set true behind HTTPS (production).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # nginx is a trusted reverse proxy in front of the API (needed so rate limiting sees client IPs)
      FORWARD_HEADERS_STRATEGY: native
      MANAGER_EMAIL: ${MANAGER_EMAIL:-}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      MANAGER_NAME: ${MANAGER_NAME:-Store Manager}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  pgdata:
