spring:
  application:
    name: store-inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/store_inventory}
    username: ${DB_USERNAME:store}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  jwt:
    # Required. Base64-encoded HMAC key, at least 32 bytes decoded. Never commit a real value.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:store-inventory}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh:
    ttl: ${REFRESH_TOKEN_TTL:P7D}
    cookie-name: refresh_token
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window: ${LOGIN_WINDOW:PT15M}
  bootstrap:
    manager-email: ${MANAGER_EMAIL:}
    manager-password: ${MANAGER_PASSWORD:}
    manager-name: ${MANAGER_NAME:Store Manager}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.store.inventory: INFO
